# Android
android.useAndroidX=true
android.enableJetifier=false

# Gradle Performance (High Memory Config)
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin
kotlin.code.style=official

# Java Version - Android Gradle Plugin 8.3.0 requires Java 17
# WINDOWS USERS: Uncomment and update the line below with your Java 17 path
# Example: org.gradle.java.home=C:/Program Files/Java/jdk-17
# Or: org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# WSL/Linux (for testing only - remove this line when building on Windows):
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
